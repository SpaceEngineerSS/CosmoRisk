<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif">
<rect width="880" height="460" fill="#111214"/>
<text x="40.0" y="40.0" font-size="11" fill="#ffb000" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" >05</text><text x="64.0" y="40.0" font-size="11" fill="#c2bdb2" text-anchor="start" font-weight="600" letter-spacing="1.6" >TARGET PLANE</text>
<text x="40.0" y="60.0" font-size="12" fill="#908c83" text-anchor="start" font-weight="400" >The plane through Earth perpendicular to the incoming velocity. A deflection moves the crossing point.</text>
<line x1="100" y1="260" x2="560" y2="260" stroke="#393c41"/>
<line x1="330" y1="90" x2="330" y2="430" stroke="#393c41"/>
<text x="566.0" y="264.0" font-size="15" fill="#c2bdb2" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" >ξ</text>
<text x="336.0" y="86.0" font-size="15" fill="#c2bdb2" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" >ζ</text>
<circle cx="330" cy="260" r="96" fill="#ff5a4e" fill-opacity="0.07" stroke="#ff5a4e" stroke-dasharray="5 4"/>
<circle cx="330" cy="260" r="62" fill="#8fb0d4" fill-opacity="0.25" stroke="#8fb0d4"/>
<text x="330.0" y="264.0" font-size="12" fill="#ece8df" text-anchor="middle" font-weight="600" >Earth</text>
<text x="400.0" y="162.0" font-size="11" fill="#ff5a4e" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" >capture radius</text>
<line x1="370" y1="290" x2="480" y2="190" stroke="#908c83" stroke-dasharray="3 3"/>
<rect x="365" y="285" width="10" height="10" fill="#ffb000"/>
<text x="380.0" y="308.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >A  before: inside the disc, impact</text>
<rect x="475" y="185" width="10" height="10" fill="#6fbf8a"/>
<text x="492.0" y="182.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >B  after deflection: miss</text>
<text x="610.0" y="130.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >The disc is larger than Earth because</text>
<text x="610.0" y="152.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >gravity bends slow asteroids inward:</text>
<text x="610.0" y="174.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" ></text>
<text x="610.0" y="196.0" font-size="13" fill="#ffb000" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" >b = R⊕ √(1 + v_esc² / v∞²)</text>
<text x="610.0" y="218.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" ></text>
<text x="610.0" y="240.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >An asteroid only has to leave this disc,</text>
<text x="610.0" y="262.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >not Earth itself. Pushing along-track</text>
<text x="610.0" y="284.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >shifts the arrival time, which moves the</text>
<text x="610.0" y="306.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >point mostly along ζ. Earlier pushes</text>
<text x="610.0" y="328.0" font-size="12" fill="#c2bdb2" text-anchor="start" font-weight="400" >need far less Δv.</text>
</svg>
