[package]
name = "cosmorisk"
version = "3.0.0"
description = "CosmoRisk - near-Earth object simulator"
authors = ["Mehmet Gümüş <contact@spacegumus.com.tr>"]
license = "MIT"
repository = "https://github.com/SpaceEngineerSS/CosmoRisk"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix keeps the lib name distinct from the binary (cargo#8519).
name = "cosmorisk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
parking_lot = "0.12"
rayon = "1.10"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
